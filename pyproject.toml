[project]
name = "chess-coach"
version = "0.1.0"
description = "Local-first post-game chess analysis and coaching"
readme = "README.md"
authors = [
    { name = "Pratik Jaiswal", email = "jaiswalpratik49@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "chess>=1.11.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
chess-coach = "chess_coach:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]
